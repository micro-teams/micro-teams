# MicroTeams deployment — stock images + bind-mounted build artifacts, no custom images.
#
#   nginx      the domain-independent gateway (SPA + /api -> cheese-auth + /mt -> backend,
#              /multipath/v3/ -> multipath, /mt/link -> origin)
#   backend    this app's jar, run on a stock JRE image
#   cheese-auth identity service (a prebuilt image)
#   postgres   shared DB: cheese-auth owns schema "public", backend owns "microteams"
#   multipath  the MultiPath server (protocol 3), the far end of every line
#   origin     the MultiPath origin of protocol 2, for clients that have not moved to 3 yet
#
# Secrets come from .env (generate it with `bash gen-env.sh`). All state lives in ./app_data/ as plain
# host directories (no docker volumes) so it's visible and easy to back up. Images carry readable tags
# here; a committed digest goes stale whenever a tag is re-pushed. The shipped bundle is still
# reproducible: package-zip (CI) resolves each tag to a digest and pins it into the bundled compose.

# Every container's log is rotated by docker: three files of 50 MB at most, so no log can fill the
# disk of a host nobody watches.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.2
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./app_data/postgresql:/var/lib/postgresql/data
      # Runs once on first init: create the "microteams" schema the backend owns (Hibernate then
      # fills its tables + sequences). A fresh DB has no stray same-named sequences, so the
      # allocation-size trap that bites a reused local DB never applies here.
      - ./init/01-microteams-schema.sql:/docker-entrypoint-initdb.d/01-microteams-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cheese-auth:
    image: ghcr.io/micro-teams/cheese-auth:dev
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PRISMA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=16
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8091"
      # prisma db push on first start is gated on a flag file under FILE_UPLOAD_PATH; the default
      # avatar (id 1) is seeded on start and every profile attaches to it.
      FILE_UPLOAD_PATH: /app/uploads
      DEFAULT_AVATAR_NAME: default.jpg
      COOKIE_BASE_URL: /
      # No public URL to configure: cheese-auth derives its own origin from the request's
      # X-Forwarded-* headers for email links, so this deployment is domain-agnostic (one instance
      # can sit behind several domains). Optionally set APP_NAME to rebrand the emails (default
      # "MicroTeams").
      APP_NAME: ${APP_NAME:-MicroTeams}
      # SMTP — cheese-auth emails a code on registration, so registration is dead without it.
      # Fill these in .env. SSL_ENABLE=true is for implicit TLS (port 465); plain/STARTTLS use false.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-25}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SSL_ENABLE: ${EMAIL_SMTP_SSL_ENABLE:-false}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-MicroTeams <no-reply@localhost>}
    volumes:
      - ./app_data/cheese-auth-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # EXACTLY ONE INSTANCE. Do not add `deploy.replicas`, and do not run a second copy behind the
  # proxy. The backend holds the machines' control links (MachineHub) and the update subscriptions
  # (UpdatesRegistry) in this JVM's memory, so a second instance would hold a different half of them:
  # a machine connected to one could not be reached through the other, and an update published on
  # one would never reach a browser subscribed to the other.
  backend:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      cheese-auth:
        condition: service_healthy
    working_dir: /app
    command: ["java", "-jar", "/app/backend.jar"]
    environment:
      # The backend derives absolute URLs from X-Forwarded-* (no domain baked in); ddl-auto=update
      # creates its tables in the "microteams" schema on first boot. Applets are mounted, not baked.
      # CORS needs no config: the backend allows its own forwarded origin (this same-origin stack),
      # derived from the X-Forwarded-* headers nginx sets — so writes don't 403 behind the proxy.
      SPRING_APPLICATION_JSON: >-
        {"spring.datasource.url":"jdbc:postgresql://postgres:5432/${POSTGRES_DB}",
        "spring.datasource.username":"${POSTGRES_USER}",
        "spring.datasource.password":"${POSTGRES_PASSWORD}",
        "spring.jpa.hibernate.ddl-auto":"update",
        "application.jwt-secret":"${JWT_SECRET}",
        "application.legacy-url":"http://cheese-auth:8091",
        "application.applets-dir":"/app/applets",
        "application.git-repo-base":"/app/app_data/git"}
    volumes:
      - ./backend/backend.jar:/app/backend.jar:ro
      - ./applets:/app/applets:ro
      - ./app_data/git:/app/app_data/git
      # The CLI distribution the backend serves at /connector/latest/<target>/<artifact>: the
      # cross-compiled `microteams` binaries + static tmux, laid out by CI under connector/.
      # Read-only — it's a shipped build artifact, not runtime state, so it lives OUTSIDE app_data/
      # (which holds only state you back up). Matches the backend's default
      # application.connector-binaries-dir (/app/connector), so nothing extra to configure.
      - ./connector:/app/connector:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The host port your outer reverse-proxy points at (defaults to 80).
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      # 127.0.0.1, not localhost: inside alpine localhost may resolve to ::1 first, but nginx here
      # listens on IPv4 only, so an IPv6 probe would be refused.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The MultiPath server: the far end of every line. A client brings up one session carried over
  # every line this deployment publishes in multipath/lines.json, and each stream of the session is
  # spliced to nginx, so a request that arrives over a line lands exactly where the same request
  # over plain HTTP lands: /api/ to auth, /mt/ to the backend, everything else to static files. It
  # starts after nginx for that reason: with nothing to splice to, a link that connects is worse
  # than none, because the client believes it has a working path.
  #
  # nginx routes /multipath/v3/ (the link endpoint and the line list) here, on every server block;
  # TLS ends in front of it. The binary comes with the bundle (multipath/multipath-server, built for
  # linux/amd64 from the multipath module the CLI pins). The line list is this deployment's own file,
  # read on every request, so a line is added or removed without a restart (deploy/README.md). The
  # limits are the protocol's defaults, spelled out; the status port is the container's own.
  multipath:
    image: alpine:3.22
    restart: unless-stopped
    logging: *logging
    depends_on:
      nginx:
        condition: service_healthy
    command:
      - /opt/multipath/multipath-server
      - -listen=:8080
      - -target=nginx:80
      - -lines-file=/opt/multipath/lines.json
      - -status=127.0.0.1:9101
      - -status-every=1m
      - -window=2097152
      - -stream-window=262144
      - -max-streams=256
      - -max-links=8
    volumes:
      # The directory, not the files: an editor that replaces lines.json with a new file is seen at
      # once, where a single-file mount would keep serving the old one.
      - ./multipath:/opt/multipath:ro
    healthcheck:
      # The line list as a client gets it (served only while the file parses) and the counters on
      # the status port: both answer only from a running server with a valid configuration.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/multipath/v3/lines && wget -q -O /dev/null http://127.0.0.1:9101/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The MultiPath origin of protocol 2, at /mt/link: the clients built before protocol 3 (connectors
  # and Android packages already installed) reach this deployment through it until they have moved
  # to the multipath server above. Spliced to nginx for the same reason; no TLS here either.
  origin:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    logging: *logging
    depends_on:
      nginx:
        condition: service_healthy
    working_dir: /app
    command: ["java", "-jar", "/app/origin.jar"]
    environment:
      MT_ORIGIN_PORT: "9443"
      MT_APP_HOST: "nginx"
      MT_APP_PORT: "80"
      MT_LINK_PATH: "/mt/link"
    volumes:
      - ./origin/origin.jar:/app/origin.jar:ro
    healthcheck:
      # A TCP connect, because there is no HTTP here to ask: what this port speaks is the substrate's
      # own framing, and anything that talks to it properly would be a second implementation of the
      # client. Accepting a connection is the whole of what the rest of the stack needs from it.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9443' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
