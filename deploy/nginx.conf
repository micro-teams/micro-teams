# The single, domain-independent gateway. Everything is same-origin so the browser's httpOnly
# refresh cookie sticks and no domain is ever baked in: the marketing site at "/", the SPA at
# "/app/", cheese-auth (/api), and this backend (/mt) are all served from whatever host an outer
# reverse-proxy maps in. That outer proxy terminates TLS and sets X-Forwarded-Proto/Host; this
# nginx forwards them so the backend can derive absolute URLs (install.sh connector base, etc.)
# without knowing its own domain.
#
# "/" used to BE the SPA (Flutter's launcher, tool/launcher.mjs, kept its own document as
# `index.html` right at the bundle root). It moved to /app/ so a plain marketing site (site/ in
# the repo) could take "/" instead, without disturbing anything API-shaped: /api, /mt,
# /install.sh, /connector, /version and /downloads are all still exactly where every existing
# client (native or web) already expects them, at the SAME paths, untouched by this.
#
# The app moves as ONE TREE — every file `flutter build web` produced, under /app/ — and that is
# not tidiness. A Flutter document resolves the engine, the assets AND its own routes against its
# <base href>, so there is exactly one place it can think it is; splitting the tree so that the
# documents sat under /app/ while the engine stayed at the root is T-093, where every status code
# in this file was right and the app still opened onto go_router's "no routes for location: /app"
# error page. app/tool/assemble-dist.mjs builds the layout and points both of the app's documents
# at the mount below, and app/tool/check-bundle.sh opens what it built in a real browser behind
# THIS config — so the prefix here and the prefix the app believes in cannot drift apart again
# without something going red.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Honor the outer proxy's forwarded values (Cloudflare terminates TLS and sets these), falling back
# to what THIS nginx sees only when they're absent. Overwriting X-Forwarded-Proto with $scheme was
# wrong: Cloudflare→nginx is plain HTTP on :80, so $scheme is "http", and the backend then derived
# "http://<host>" as its own origin — which never matches the browser's "https://<host>" Origin, so
# every credentialed POST was rejected as an "Invalid CORS request".
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ''      $host;
}

server {
    listen 80;
    server_name _;

    # Large uploads / long-lived sockets shouldn't be cut short.
    client_max_body_size 64m;

    # cheese-auth (identity) at /api — strip the prefix (it mounts routes at the root). The refresh
    # cookie is set with Path=/users/auth; rewrite it to / so it rides every /api request, matching
    # what the dev vite proxy does.
    location /api/ {
        proxy_pass http://cheese-auth:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_cookie_path /users/auth /;
    }

    # The MultiPath substrate's link endpoint. Every client — browser, Flutter, connector — brings
    # up ONE redundant stream carried over every published line at once, and each line is a
    # WebSocket to this path. It must be matched EXACTLY and before /mt/, because everything else
    # under /mt/ is the backend and this one thing is not: it is the transport terminating in front
    # of the application.
    #
    # The upstream goes through a variable on purpose. nginx resolves a literal proxy_pass host once
    # at startup and REFUSES TO START if it does not resolve; the origin container starts after this
    # one (it splices back into nginx, so it waits for nginx to be healthy), so a literal here would
    # deadlock the stack on first boot. A variable defers the lookup to request time, which is what
    # the docker DNS resolver below is for.
    #
    # The timeouts are the substrate's, not a request's: a link is held open for as long as the
    # client keeps it and carries a heartbeat of its own, so the proxy must not be the thing that
    # decides it has gone quiet.
    location = /mt/link {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $origin_upstream origin:9443;
        proxy_pass http://$origin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # This backend (teams / chat / documents / machines / agents) at /mt — strip the prefix. One
    # block covers both HTTP and every WebSocket under it (/mt/ws STOMP chat, /mt/machine/link the
    # connector, /mt/machine/screen/:sid the live viewer).
    location /mt/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # CLI distribution, served at the ORIGIN ROOT (never under /mt): the one-line installer and the
    # prebuilt `microteams`/`tmux` binaries the CLI's self-updater downloads. Proxied to the backend
    # at the SAME path (no prefix strip) — the backend maps /install.sh and /connector/... directly.
    # X-Forwarded-* let it bake the right origin into install.sh; a machine runs
    # `curl -fsSL <origin>/install.sh | sh` and then `<origin>/connector/latest/<target>/microteams`.
    location = /install.sh {
        proxy_pass http://backend:8080/install.sh;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    location /connector/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The marketing site (site/ in the repo): plain static pages, no client-side router, so an
    # unknown path is genuinely a 404 rather than something to hand to app code.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # The SPA, now under its own prefix. Static, domain-independent (relative /api and /mt paths);
    # any unknown route under here falls back to /app/index.html for client-side routing.
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;

        # Readable from any origin, and only here.
        #
        # The launcher races the entry module across every line and then imports it from whichever
        # answered first — a cross-origin module import, which the browser refuses without this
        # header. With one line nothing is cross-origin and this changes nothing; the day a second
        # line is added it is the difference between the race working and the application failing to
        # start on the line that won.
        #
        # "*" is right for these bytes specifically: build artefacts are public, identical on every
        # line, and carry no session. It must never spread to /api or /mt, which are answered above
        # with a credentialed, per-origin CORS policy the backend decides.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Nothing whose NAME does not change may be held without asking.
    #
    # This is not tuning; it is the difference between a deploy landing and a deploy appearing to
    # land. Flutter emits `main.dart.js` under that name for every build, our document and worker
    # likewise, so a cached copy of any of them is indistinguishable from the new one — and a copy
    # that is four hours stale (the default this deployment was serving) hides a deploy for four
    # hours. Worse, the Service Worker fills its own cache with `fetch()`, which goes through the
    # HTTP cache: a stale copy there gets stored as if it were the new build.
    #
    # `no-cache` does not mean "do not store". It means "revalidate before use", so a browser that
    # already has the bytes still gets a 304 and nothing is re-downloaded when nothing changed.
    # Offline speed comes from the Service Worker, which is exactly where it should come from.
    #
    # `/version` is stricter than the rest: it is the one thing a cached client asks in order to
    # find out that it IS a cached client, and an answer about the past would defeat the whole
    # arrangement. So it is never stored at all.
    # The installable clients. Their paths carry the version, so a file at a given path is the same
    # file forever — which is exactly when "cache it for a year" is honest rather than a gamble.
    #
    # `Content-Disposition: attachment` is the part that makes the link a DOWNLOAD. A browser given
    # only a content type decides for itself what to do with it, and what it decided here was to
    # navigate to the file — so the tap did nothing anybody could see. Saying "attachment" removes
    # the choice, and it is the honest description: nothing about an APK is meant to be displayed.
    location ~* ^/downloads/.+\.apk$ {
        root /usr/share/nginx/html;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # …except the manifest that lists them, which changes with every deploy and is the thing a
    # client reads to find out what exists.
    location = /downloads/clients.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /version {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # All of these are under /app/, because the app is: see the top of this file.
    location ~* ^/app/(index\.html|app\.html|sw\.js|unregister\.html|flutter_bootstrap\.js|main\.dart\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
