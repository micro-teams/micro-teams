name: Compose app

# The Compose Multiplatform rewrite, built independently of build.yml while it lives in app/
# alongside (then eventually instead of) the Flutter client. Every push here builds a web bundle
# and an Android APK and uploads them as downloadable artifacts — the point, while this is a PR
# nictheboy is not merging yet, is to be able to pull a fresh APK/web build off CI without a
# merge, per the plan in that PR's description.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/compose-app.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: compose-web
          path: app/composeApp/build/dist/wasmJs/productionExecutable

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: compose-android
          path: app/composeApp/build/outputs/apk/debug/*.apk
