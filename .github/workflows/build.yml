name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# One workflow builds all four parts in parallel, packages them into a deployment zip, then proves
# the zip actually boots by bringing the docker-compose cluster up and waiting for every service to
# report healthy.

jobs:
  build-jar:
    runs-on: ubuntu-latest
    # No packages: read: the backend builds from Maven Central alone.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: backend/pom.xml

      # Packaging only. The tests live in test-api below, because they are integration tests that
      # need a real Postgres and the real cheese-auth service — and there is no reason for the job
      # that produces the jar to need a database to do it. Splitting them means this job is red only
      # when the jar itself cannot be built, and the deployment bundle stops waiting on a test suite.
      - name: Build with Maven (packaging only)
        run: ./mvnw install -DskipTests

      - name: Check uncommitted changes to ensure format applied
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            echo "There are uncommitted changes. Please run './mvnw spotless:apply' and commit the changes."
            exit 1
          else
            echo "No uncommitted changes."
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: jar
          path: backend/target/*.jar

  # The backend's own tests. They are integration tests — every one of them talks to a real Postgres
  # and the real cheese-auth service — so they bring their dependencies up themselves rather than
  # borrowing the packaging job's runner. What belongs here is what has no picture in the product
  # (an ops endpoint that must not appear on the public port, a bare repo made twice, anything that
  # needs exact timing).
  test-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: backend/pom.xml

      - name: Start dependencies (Postgres + cheese-auth)
        run: ./scripts/dependency-start.sh

      # -Dschema.regenerate.skip=false brings back the step that boots the application to rewrite
      # CREATE.sql from the entities. It lives here rather than in packaging because it needs a
      # database, and the check below is what it is for: if the entities moved and CREATE.sql did
      # not, the file comes back changed and this job says so.
      - name: Run the tests
        run: ./mvnw verify -Dschema.regenerate.skip=false
        env:
          SPRING_APPLICATION_JSON: '{"spring.jpa.hibernate.ddl-auto":"update","application.git-repo-base":"${{ runner.temp }}/microteams-git"}'

      - name: Check CREATE.sql matches the entities
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            git diff
            echo "CREATE.sql (or something else) changed while running the tests. Commit it."
            exit 1
          else
            echo "No uncommitted changes."
          fi

  # The client: typecheck, lint, unit tests and the web build in one job; the Android build in
  # another, because it is most of the time and has nothing to wait for.
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # The multipath package in app/vendor is what the commit cli/go.mod pins builds to.
      - run: ../scripts/multipath-pin.sh --check
      - run: npm ci
      - run: npm run codegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # VERSION-<commit>: what the app shows, and the key the web build's cache is named after.
      - run: |
          export MT_VERSION="$(cat ../VERSION)-${GITHUB_SHA::7}"
          EXPO_PUBLIC_MT_VERSION="$MT_VERSION" npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: web-dist
          path: app/web-dist

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    # The signing secrets at the job, not the step: a step's own `if` cannot see env declared on that
    # same step, nor the secrets context at all. Empty in a repository without the key.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-app-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json') }}
          restore-keys: gradle-app-${{ runner.os }}-
      - run: npm ci
      - run: npm run codegen
      # The version code: above every code already installed (see app.config.js), rising with each
      # run.
      - run: MT_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER)) npx expo prebuild --platform android --no-install
      # The key the installed copies were signed with, so an installed copy is replaced in place
      # (plugins/release-signing.js reads key.properties). Without it the APK is debug-signed, and
      # says so in clients.json: a debug-signed package cannot later be replaced by a signed one.
      - name: Write the release key, if this repository has one
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/microteams-release.p12
          cat > android/key.properties <<PROPS
          storeFile=microteams-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          PROPS
          echo "MT_APK_SIGNED=release" >> "$GITHUB_ENV"
      # arm64 for phones, x86_64 for the emulator the journey runs on: one APK serves both.
      - name: Build the release APK
        working-directory: app/android
        run: EXPO_PUBLIC_MT_VERSION="$(cat ../../VERSION)-${GITHUB_SHA::7}" ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon -q
      - name: Collect what gets published
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk ../out/
          echo "${MT_APK_SIGNED:-debug}" > ../out/signed.txt
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: android-apk
          path: out

  build-applet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: applets
    steps:
      - uses: actions/checkout@v7
      # openapi-generator (the codegen step) runs on the JVM.
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: applets/package-lock.json
      # The screen drivers are built from the micro-connector commit cli/go.mod pins, which go
      # resolves (scripts/connector-drivers.sh): the connector and its drivers are one version.
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run build
      - name: Upload applets
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: applets
          path: applets/dist

  build-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # The Go tests existed but nothing ran them, so a broken one could not fail CI. tmux is what
      # the terminal package's test drives; the runner image usually has it, install if not.
      - name: Test
        working-directory: cli
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y -qq tmux
          # -race: the service supervises its multipath client from several goroutines while the
          # control link asks it where to dial. micro-connector and multipath run their Go tests the
          # same way.
          go test -race ./...
      - name: Build binaries (one per OS/arch)
        run: |
          set -euo pipefail
          mkdir -p dist
          # Product version from the repo-root VERSION file (single source of truth,
          # managed by scripts/version.sh), with the short commit as build metadata for
          # traceability — e.g. 0.1.0+1a2b3c4. cwd is cli/, so VERSION is one level up.
          VERSION="$(cat ../VERSION)+${GITHUB_SHA::7}"
          # Unix only: the host uses a pty, tmux, and SIGUSR2, so a machine that runs agents is
          # always Linux or macOS — Windows is not a target (it lacks syscall.SIGUSR2).
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            echo "building microteams-$os-$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/microteams-$os-$arch" .
            # The multipath client the service runs beside it, from the module go.mod pins.
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
              -o "dist/multipath-client-$os-$arch" github.com/micro-teams/multipath/go/cmd/multipath-client
          done
          # The deployment's multipath server, from the same module, for the bundle's linux/amd64 host.
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o dist/multipath-server-linux-amd64 github.com/micro-teams/multipath/go/cmd/multipath-server
          ls -la dist
      - name: Upload cli binaries
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: cli-binaries
          path: cli/dist

  build-tmux:
    # A fully static tmux per Linux target, so a fresh machine needs nothing pre-installed:
    # install.sh drops it at ~/.config/microteams/bin/tmux (macOS is not published — install.sh
    # falls back to copying the machine's own tmux there). Only the build recipe is in git.
    #
    # Built NATIVELY on a matching-arch runner: under QEMU emulation an arm64 build is minutes of
    # emulated gcc, whatever `make -j$(nproc)` asks for. The two arches run as parallel matrix jobs,
    # and the result is cached by the build recipe's hash so an unchanged tmux version rebuilds
    # instantly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm   # GitHub-hosted native arm64 (no QEMU)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache the built static tmux
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: dist/linux-${{ matrix.arch }}/tmux
          key: tmux-${{ matrix.arch }}-${{ hashFiles('deploy/tmux/Dockerfile', 'deploy/tmux/build-static-tmux.sh') }}
      - name: Set up Docker Buildx
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build static tmux (native, no QEMU)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          deploy/tmux/build-static-tmux.sh --arch "${{ matrix.arch }}" --out dist
          ls -la dist/*/
      - name: Upload tmux binary
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: tmux-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

  package-zip:
    needs: [build-jar, build-app, build-android, build-applet, build-cli, build-tmux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble the deployment bundle
        run: |
          set -euo pipefail
          STAGE=microteams-deploy
          mkdir -p "$STAGE/backend" "$STAGE/frontend" "$STAGE/applets" "$STAGE/multipath"
          cp deploy/docker-compose.yml deploy/nginx.conf deploy/gen-env.sh deploy/README.md "$STAGE/"
          cp -r deploy/init deploy/migration "$STAGE/"
          # Ship the JPA-generated schema at the bundle root. The stack still creates/updates its own
          # tables (ddl-auto=update), so this file is NOT applied automatically — it's a reference for
          # ops: it shows the full table structure this build expects, and diffing it against the
          # previous bundle's copy reveals exactly what changed, so an operator can plan any manual
          # migration an upgrade needs. Committed in-repo (CI verifies it matches the entities).
          cp backend/CREATE.sql "$STAGE/CREATE.sql"
          cp artifacts/jar/*.jar "$STAGE/backend/backend.jar"
          # The multipath server; its line list (multipath/lines.json) is the deployment's own and
          # never shipped.
          cp artifacts/cli-binaries/multipath-server-linux-amd64 "$STAGE/multipath/multipath-server"
          chmod +x "$STAGE/multipath/multipath-server"
          # The marketing site at "/", the web client under /app/, /version at the root, and the
          # Android client under /downloads/ with the manifest that lists it.
          VERSION="$(cat VERSION)-${GITHUB_SHA::7}"
          mkdir -p "$STAGE/frontend/dist/app"
          find site -maxdepth 1 -type f ! -name README.md -exec cp {} "$STAGE/frontend/dist/" \;
          cp -r artifacts/web-dist/. "$STAGE/frontend/dist/app/"
          echo "$VERSION" > "$STAGE/frontend/dist/version"
          node app/tool/add-clients.mjs "$STAGE/frontend/dist" "$VERSION" artifacts/android-apk/app-release.apk "$(cat artifacts/android-apk/signed.txt)"
          cp artifacts/applets/*.js "$STAGE/applets/"
          chmod +x "$STAGE/gen-env.sh"
          # The CLI distribution the backend serves: the cross-compiled `microteams` binaries, the
          # multipath clients and the static tmux, laid out as
          # connector/<target>/{microteams,multipath-client,tmux} (Go-style os-arch, matching
          # install.sh's `target` and update.go's platformDir). It's a shipped build artifact, so it
          # lives at the top level as connector/ — NOT under app_data/, which gen-env.sh creates fresh
          # at deploy time and holds only state you back up. compose bind-mounts connector/ to the
          # backend's default application.connector-binaries-dir (/app/connector).
          CONN="$STAGE/connector"
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${t%-*}"; arch="${t#*-}"
            mkdir -p "$CONN/$t"
            cp "artifacts/cli-binaries/microteams-$os-$arch" "$CONN/$t/microteams"
            cp "artifacts/cli-binaries/multipath-client-$os-$arch" "$CONN/$t/multipath-client"
            chmod +x "$CONN/$t/microteams" "$CONN/$t/multipath-client"
          done
          # Static tmux is Linux-only; macOS uses its own via install.sh's system-tmux fallback.
          # Each arch is its own artifact (tmux-linux-<arch>/tmux) from the matrix build.
          for t in linux-amd64 linux-arm64; do
            arch="${t#linux-}"
            if [ -f "artifacts/tmux-linux-$arch/tmux" ]; then
              cp "artifacts/tmux-linux-$arch/tmux" "$CONN/$t/tmux"
              chmod +x "$CONN/$t/tmux"
            fi
          done
          # Pin every image to a digest in the SHIPPED compose so a deployed bundle is reproducible,
          # while the repo keeps only readable tags (a committed hash goes stale whenever a tag is
          # re-pushed). buildx imagetools reads public manifests with no auth; the resolved digest is
          # the multi-arch index digest, which is what compose should pull.
          COMPOSE="$STAGE/docker-compose.yml"
          for ref in $(grep -oE '^[[:space:]]*image:[[:space:]]*[^[:space:]]+' "$COMPOSE" | awk '{print $NF}'); do
            case "$ref" in *@sha256:*) continue ;; esac   # already pinned — leave it
            # Retry: registry manifest reads blip intermittently and shouldn't fail a release.
            digest=""
            for attempt in 1 2 3 4 5; do
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              case "$digest" in sha256:*) break ;; esac
              echo "  ($ref) digest not resolved yet (attempt $attempt), retrying…" >&2
              sleep 3
            done
            case "$digest" in sha256:*) : ;; *) echo "could not resolve digest for $ref after retries" >&2; exit 1 ;; esac
            esc="$(printf '%s' "$ref" | sed 's/[.[\*^$/]/\\&/g')"   # escape regex metachars in the tag
            sed -i "s#image: ${esc}\$#image: ${ref}@${digest}#" "$COMPOSE"
            echo "pinned $ref -> ${ref}@${digest}"
          done
          echo "== pinned images =="; grep -nE '^[[:space:]]*image:' "$COMPOSE"
          echo "== bundle contents =="; find "$STAGE" -type f | sort
      # Upload the bundle DIRECTORY, not a pre-made zip: actions/upload-artifact already zips what it
      # receives, so uploading a .zip would nest it (download → microteams-deploy.zip → the real zip).
      # Uploading the dir means the downloaded artifact zip IS the bundle, one layer.
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: microteams-deploy
          path: microteams-deploy

  # The matrix is what plays the agent's program: the real Claude Code and pi, each in front of a
  # mock model API.
  #
  # `npm:2.1.220` and `pi:0.87.0` are PINNED, which is where the determinism comes from: nothing about
  # them can change without us changing the number, so a red run means we broke something. The
  # pinned Claude leg is also the one that proves the applet drives Claude Code at all: through the
  # first-run wizard, the bypass-permissions gate, and back out through `microteams api say`.
  #
  # The `installer` leg tracks Claude Code's latest and stays advisory (continue-on-error): a UI
  # change upstream is intelligence worth having, not a reason to block someone else's merge. When it
  # goes red, the fix belongs in the applet, and the pinned leg is what says whether we broke it.
  #
  # The machinery, without anybody using it: the connector, its private tmux, the applet, and the
  # path a message takes into a program's stdin — driven by curl, with no client in the picture.
  # It is NOT the whole product end to end: it is deliberately the layer underneath the client, where
  # a failure means the plumbing broke rather than the interface.
  test-machinery:
    name: machinery (connector, tmux, a message into stdin)
    needs: [package-zip]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: npm:2.1.220
            experimental: false
          - leg: pi:0.87.0
            experimental: false
          - leg: installer
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      # The viewer e2e.sh keeps on the live screen is a Node WebSocket client.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The artifact is the bundle directory (not a zip); download-artifact restores its files
      # directly into microteams-deploy/ — no unzip step, and no nested archive. Note: artifact
      # up/download does NOT preserve the executable bit, so gen-env.sh is invoked via `bash` and the
      # connector binaries are chmod'ed on the machine after they are copied in.
      - uses: actions/download-artifact@v8
        with:
          name: microteams-deploy
          path: microteams-deploy
      # The line list names http://nginx, the address the machine below reaches the stack at, so
      # its control link rides the multipath client.
      - name: Bring the cluster up and wait for every service to be healthy
        working-directory: microteams-deploy
        run: |
          MULTIPATH_ORIGIN=http://nginx bash gen-env.sh
          chmod +x multipath/multipath-server
          docker compose up -d --wait --wait-timeout 360
      # Only the pinned leg exercises `microteams update`: it needs a distinctly-versioned connector
      # binary so the e2e can PROVE the running service re-execed into the freshly downloaded one
      # (not merely that a file on disk changed). Which program plays the agent does not matter to
      # it; exactly one leg has to carry it. `setup-go` matches build-cli's toolchain, and the two env vars below persist
      # to the "End-to-end" step in the same job/leg.
      - uses: actions/setup-go@v7
        if: matrix.leg == 'npm:2.1.220'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build a marker-versioned connector (to prove `microteams update` swaps and re-execs)
        if: matrix.leg == 'npm:2.1.220'
        run: |
          MARKER="update-e2e-${GITHUB_SHA::12}"
          ( cd cli && go build -trimpath -ldflags "-X main.version=$MARKER" -o "$GITHUB_WORKSPACE/updated-microteams" . )
          echo "UPDATE_MARKER_BIN=$GITHUB_WORKSPACE/updated-microteams" >> "$GITHUB_ENV"
          echo "UPDATE_MARKER_VERSION=$MARKER" >> "$GITHUB_ENV"
      - name: "End-to-end: machine + agent + a message that must arrive (${{ matrix.leg }})"
        working-directory: microteams-deploy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/e2e.sh" "${{ matrix.leg }}"
      - name: Cluster status
        if: always()
        working-directory: microteams-deploy
        run: docker compose ps
      - name: Dump logs on failure
        if: failure()
        working-directory: microteams-deploy
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        working-directory: microteams-deploy
        run: docker compose down

  # The journey: the bundle above, driven through the client a person uses — one script, on the
  # web build in Chromium and on the Android build in an emulator — with a real machine in it: the
  # connector and tmux from the bundle, and a real agent program in front of a mock model, which the
  # journey asks whether what was typed in the app reached it. See app/e2e/journey.ts.
  #
  # Each run pairs a client with a program, so that every client and every program is covered in
  # as few runs as that allows rather than in every combination. The pinned programs are where
  # determinism comes from; `installer` is Claude Code's latest and advisory, as in test-machinery.
  test-journeys:
    needs: [package-zip]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: web
            leg: npm:2.1.220
            driver: ""
            browser: chromium
            viewport: phone
            experimental: false
          # The live screen differs most between engines and between a touch phone and a desktop
          # with a wheel and a mouse: the other engine, on a desktop.
          - client: web
            leg: npm:2.1.220
            driver: ""
            browser: firefox
            viewport: desktop
            experimental: false
          # A phone's Firefox: its own touch handling around a held finger, which selects.
          - client: web
            leg: npm:2.1.220
            driver: ""
            browser: firefox
            viewport: phone
            experimental: false
          - client: android
            leg: pi:0.87.0
            driver: pi
            experimental: false
          - client: web
            leg: installer
            driver: ""
            browser: chromium
            viewport: phone
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      RUN: j${{ github.run_id }}${{ strategy.job-index }}
      LEG: ${{ matrix.leg }}
      DRIVER: ${{ matrix.driver }}
      BROWSER: ${{ matrix.browser }}
      VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: microteams-deploy
          path: microteams-deploy
      - name: Bring the bundle up, with three lines and a mail sink for sign-up codes
        run: |
          bash app/e2e/stack.sh microteams-deploy
          bash app/e2e/counters.sh baseline
      - name: A machine waiting to be approved (${{ matrix.leg }})
        run: echo "ENROLL=$(bash app/e2e/machine.sh up microteams-deploy '${{ matrix.leg }}' | tail -1)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app/e2e
      - name: The journey, in a browser
        if: matrix.client == 'web'
        working-directory: app/e2e
        run: |
          npx playwright install --with-deps chromium ${{ matrix.browser }}
          # Is everything where it is served (the site at /, the app under /app/, deep links, the
          # worker's scope, /version)? Then the journey through the app.
          npx tsx bundle.ts http://localhost
          npx tsx run.ts web http://localhost/app/
      - name: Let the emulator use KVM
        if: matrix.client == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Appium
        if: matrix.client == 'android'
        run: |
          npm i -g appium
          appium driver install uiautomator2
          nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
      - name: The journey, on an emulator
        if: matrix.client == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone's screen rather than the default 320×640: what people hold, and what the
          # layouts are judged on.
          profile: pixel_6
          disable-animations: true
          # The emulator's own launcher sometimes stops answering under load, and the system's
          # "isn't responding" dialog then covers the app the journey is driving: hidden here.
          # The app reaches the stack's three lines under the names every client uses
          # (http://localhost, :8081, :8082); adbd as root may forward port 80. When the journey is
          # over, the app must have dialled the stack's lines alone (stayed-local.sh), and it is
          # stopped so the server's counters can settle. A failed journey prints the app's log, and
          # why Android ended its process if it did (a crash, a killed WebView renderer).
          script: adb shell settings put global hide_error_dialogs 1 && adb root && sleep 3 && adb wait-for-device && adb reverse tcp:80 tcp:80 && adb reverse tcp:8081 tcp:8081 && adb reverse tcp:8082 tcp:8082 && adb install microteams-deploy/frontend/dist/downloads/*/microteams-*-android.apk && cd app/e2e && (npx tsx run.ts android http://localhost || (adb logcat -d -s ReactNativeJS:V | tail -200; adb logcat -d -s AndroidRuntime:E ActivityManager:I chromium:E DEBUG:F | grep -iE 'app.microteams|died|crash|fatal|renderer' | tail -80; exit 1)) && bash stayed-local.sh ../../microteams-deploy/multipath/lines.json && adb shell am force-stop app.microteams.microteams
      - name: The app's and the machine's requests went over the lines
        run: bash app/e2e/carried.sh
      - name: Every client gone, the multipath server holds nothing
        run: |
          bash app/e2e/machine.sh stop
          bash app/e2e/counters.sh settled
      - name: What went wrong
        if: failure()
        run: |
          tail -60 appium.log 2>/dev/null || true
          bash app/e2e/machine.sh logs
          cd microteams-deploy && docker compose -p e2e logs --no-color --tail 80 cheese-auth backend multipath
          docker logs --tail 40 e2e-lines
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: journey-failure-${{ matrix.client }}-${{ strategy.job-index }}
          path: app/e2e/failure.png

  # One check to require in branch protection: it succeeds only when every job above did (a job with
  # `needs` runs only if all of them passed), so adding a job later never means editing the rule.
  # The leaves, and nothing else: package-zip already needs every build, and both test jobs already
  # need package-zip, so naming those here would only repeat what the graph says. A job
  # whose dependency fails is skipped rather than failed, and a skipped need is not a success — so
  # this still cannot go green over a broken build.
  #
  # The one thing to remember when adding a job: if nothing else depends on it, it belongs here, or
  # it is a check that can go red without anybody being stopped.
  ci-success:
    name: CI success
    needs: [test-api, test-machinery, test-journeys]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI jobs passed."
