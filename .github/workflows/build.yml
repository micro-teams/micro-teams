name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# One workflow builds all four parts in parallel, packages them into a deployment zip, then proves
# the zip actually boots by bringing the docker-compose cluster up and waiting for every service to
# report healthy.

jobs:
  build-jar:
    runs-on: ubuntu-latest
    # The MultiPath starter comes from GitHub Packages, which requires an authenticated read even
    # for a public package — the same friction as the npm packages in the jobs below.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: backend/pom.xml
          # Credentials for the `github` repository declared in backend/pom.xml, written to
          # ~/.m2/settings.xml — where Maven looks on its own, so `./mvnw install` stays `./mvnw
          # install`. Not settings-path: that puts the file inside the checkout, where Maven does not
          # read it and where the spotless "uncommitted changes" check has to be told to ignore it.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      # Packaging only. The tests live in test-api below, because they are integration tests that
      # need a real Postgres and the real cheese-auth service — and there is no reason for the job
      # that produces the jar to need a database to do it. Splitting them means this job is red only
      # when the jar itself cannot be built, and the deployment bundle stops waiting on a test suite.
      - name: Build with Maven (packaging only)
        run: ./mvnw install -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check uncommitted changes to ensure format applied
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            echo "There are uncommitted changes. Please run './mvnw spotless:apply' and commit the changes."
            exit 1
          else
            echo "No uncommitted changes."
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: jar
          path: backend/target/*.jar

  # The backend's own tests. They are integration tests — every one of them talks to a real Postgres
  # and the real cheese-auth service — so they bring their dependencies up themselves rather than
  # borrowing the packaging job's runner. What survives here is meant to shrink: the rules that show
  # up as something a person can do are moving into the journeys, and this suite keeps the ones with
  # no picture in the product (an ops endpoint that must not appear on the public port, a bare repo
  # made twice, anything that needs exact timing).
  test-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: backend/pom.xml
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Start dependencies (Postgres + cheese-auth)
        run: ./scripts/dependency-start.sh

      # -Dschema.regenerate.skip=false brings back the step that boots the application to rewrite
      # CREATE.sql from the entities. It lives here rather than in packaging because it needs a
      # database, and the check below is what it is for: if the entities moved and CREATE.sql did
      # not, the file comes back changed and this job says so.
      - name: Run the tests
        run: ./mvnw verify -Dschema.regenerate.skip=false
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRING_APPLICATION_JSON: '{"spring.jpa.hibernate.ddl-auto":"update","application.git-repo-base":"${{ runner.temp }}/microteams-git"}'

      - name: Check CREATE.sql matches the entities
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            git diff
            echo "CREATE.sql (or something else) changed while running the tests. Commit it."
            exit 1
          else
            echo "No uncommitted changes."
          fi

  # The web client. It is the ONLY frontend now — frontend/ (React + Vite) is gone, because one
  # person maintaining two implementations of the same product maintains neither.
  # The app is built in three jobs rather than one, and the reason is arithmetic: the Android build
  # is three and a half minutes of the seven, and it has nothing to do with the web build. Run side
  # by side they cost the longer of the two; run in sequence they cost the sum.
  #
  #   build-android   the installable client
  #   build-web       the web build, and every check that gates a merge
  #   assemble-web    the two put together: the clients dropped into the bundle, then stamped
  #
  # The stamping happens last, in one place, so what /version says and what is in the bundle cannot
  # disagree.
  build-android:
    runs-on: ubuntu-latest
    # At the job, not at the step: a step's own `if` cannot see env declared on that same step, and
    # it can never see the secrets context at all. Empty when this repository has no key.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-app

      # Gradle downloads a great deal on a cold machine and almost nothing on a warm one.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write the release key, if this repository has one
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: app
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/microteams-release.p12
          cat > android/key.properties <<PROPS
          storeFile=microteams-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          PROPS
          echo "MT_APK_SIGNED=release" >> "$GITHUB_ENV"

      # arm64 only for now: every phone sold in years is arm64, and another architecture is one more
      # entry in the manifest rather than a change to any code.
      - name: Build the Android client
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name="${MT_VERSION%%-*}" --build-number="$MT_BUILD_NUMBER" \
            --dart-define=MT_VERSION=$MT_VERSION \
            --dart-define=MT_BUILT_AT=$MT_BUILT_AT

      # Collected into one flat directory before upload, so the artifact's shape is something this
      # workflow decided rather than something it inherits: given two paths, the artifact's root
      # becomes their common ancestor, and the packages end up several directories deeper than
      # whoever downloads them expects.
      #
      # How it was signed travels with them: the assembling job writes it into clients.json, and a
      # debug-signed package cannot be replaced in place by a properly signed one later.
      - name: Collect what gets published
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/*.apk out/
          echo "${MT_APK_SIGNED:-debug}" > out/signed.txt

      - uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: android-apk
          path: out

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-app

      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=MT_VERSION=$MT_VERSION \
            --dart-define=MT_BUILT_AT=$MT_BUILT_AT

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The browsers are a fixed download for a pinned version of Playwright, which is exactly what
      # a cache is for.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # The half of this that no unit test can reach: whether the app actually paints, whether the
      # worker registers and stores the engine, whether a second visit works with the network off,
      # and whether the escape hatch clears it all. The React build passed every unit test it had
      # and did not start offline; that is why its check existed, and why this one replaces it.
      #
      # The bundle is finished here — launcher, stamp and all. The installable clients are dropped
      # in later, by the job that assembles the deployment, because nothing in the stamping reads
      # them: the version comes from VERSION and the commit, and the launcher preloads code, engine
      # and fonts. Waiting for the Android build before stamping would put four minutes back into
      # the critical path for no reason.
      # The icons are generated from branding/logo.svg rather than committed by hand, so a change to
      # the mark cannot leave a stale favicon behind. Before the build copies web/ into the bundle.
      - name: Check the built app in a real browser
        run: |
          npx playwright install --with-deps chromium
          node tool/icons.mjs
          node tool/launcher.mjs build/web
          node tool/make-sw.mjs build/web
          bash tool/check-web.sh

      - name: Upload the web build
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: web-dist
          path: app/build/web

  build-applet:
    runs-on: ubuntu-latest
    # The screen drivers are installed from @micro-teams/connector-applets on GitHub Packages, which
    # requires an authenticated request even for a public package.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: applets
    steps:
      - uses: actions/checkout@v7
      # openapi-generator (the codegen step) runs on the JVM.
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: applets/package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@micro-teams"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Upload applets
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: applets
          path: applets/dist

  build-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # The Go tests existed but nothing ran them, so a broken one could not fail CI. tmux is what
      # the terminal package's test drives; the runner image usually has it, install if not.
      - name: Test
        working-directory: cli
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y -qq tmux
          # -race: the connector now races requests across lines and measures them from a background
          # loop while short commands read the same cache, so "does it work" and "does it work
          # concurrently" have stopped being the same question. micro-connector and multipath both
          # run their Go tests this way.
          go test -race ./...
      - name: Build binaries (one per OS/arch)
        run: |
          set -euo pipefail
          mkdir -p dist
          # Product version from the repo-root VERSION file (single source of truth,
          # managed by scripts/version.sh), with the short commit as build metadata for
          # traceability — e.g. 0.1.0+1a2b3c4. cwd is cli/, so VERSION is one level up.
          VERSION="$(cat ../VERSION)+${GITHUB_SHA::7}"
          # Unix only: the host uses a pty, tmux, and SIGUSR2, so a machine that runs agents is
          # always Linux or macOS — Windows is not a target (it lacks syscall.SIGUSR2).
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            echo "building microteams-$os-$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/microteams-$os-$arch" .
          done
          ls -la dist
      - name: Upload cli binaries
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: cli-binaries
          path: cli/dist

  build-tmux:
    # A fully static tmux per Linux target, so a fresh machine needs nothing pre-installed:
    # install.sh drops it at ~/.config/microteams/bin/tmux (macOS is not published — install.sh
    # falls back to copying the machine's own tmux there). Only the build recipe is in git.
    #
    # Built NATIVELY on a matching-arch runner — the arm64 build used to run under QEMU emulation
    # (minutes of emulated gcc; the Dockerfile already passes `make -j$(nproc)`, so the bottleneck was
    # emulation, not parallelism). The two arches now run as parallel matrix jobs, and the result is
    # cached by the build recipe's hash so an unchanged tmux version rebuilds instantly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm   # GitHub-hosted native arm64 (no QEMU)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache the built static tmux
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: dist/linux-${{ matrix.arch }}/tmux
          key: tmux-${{ matrix.arch }}-${{ hashFiles('deploy/tmux/Dockerfile', 'deploy/tmux/build-static-tmux.sh') }}
      - name: Set up Docker Buildx
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build static tmux (native, no QEMU)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          deploy/tmux/build-static-tmux.sh --arch "${{ matrix.arch }}" --out dist
          ls -la dist/*/
      - name: Upload tmux binary
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: tmux-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

  package-zip:
    needs: [build-jar, build-web, build-android, build-applet, build-cli, build-tmux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # For tool/add-clients.mjs below. It imports nothing outside the repository, so there is no
      # install step to go with it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble the deployment bundle
        run: |
          set -euo pipefail
          STAGE=microteams-deploy
          mkdir -p "$STAGE/backend" "$STAGE/frontend" "$STAGE/applets"
          cp deploy/docker-compose.yml deploy/nginx.conf deploy/gen-env.sh deploy/README.md "$STAGE/"
          cp -r deploy/init "$STAGE/"
          # Ship the JPA-generated schema at the bundle root. The stack still creates/updates its own
          # tables (ddl-auto=update), so this file is NOT applied automatically — it's a reference for
          # ops: it shows the full table structure this build expects, and diffing it against the
          # previous bundle's copy reveals exactly what changed, so an operator can plan any manual
          # migration an upgrade needs. Committed in-repo (CI verifies it matches the entities).
          cp backend/CREATE.sql "$STAGE/CREATE.sql"
          cp artifacts/jar/*.jar "$STAGE/backend/backend.jar"
          cp -r artifacts/web-dist/. "$STAGE/frontend/dist/"
          # The installable clients, into the bundle that is actually deployed. Here rather than in
          # the web job because this is the moment the two halves meet, and it is the only place
          # that has both.
          MT_VERSION="$(cat VERSION)-${GITHUB_SHA::7}" \
          MT_APK_SIGNED="$(cat artifacts/android-apk/signed.txt 2>/dev/null || echo debug)" \
            node app/tool/add-clients.mjs "$STAGE/frontend/dist" artifacts/android-apk
          # And that they are really there: a bundle that advertises a client it does not carry is
          # a download button that 404s.
          node -e '
            const fs = require("node:fs");
            const root = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(root + "/downloads/clients.json", "utf8"));
            if (!manifest.clients.length) throw new Error("no clients in the bundle");
            for (const client of manifest.clients) {
              const size = fs.statSync(root + client.url).size;
              if (size !== client.bytes) throw new Error(client.url + " is " + size + ", manifest says " + client.bytes);
              console.log(client.url, size, client.signed + "-signed");
            }
          ' "$STAGE/frontend/dist"
          cp artifacts/applets/*.js "$STAGE/applets/"
          chmod +x "$STAGE/gen-env.sh"
          # The CLI distribution the backend serves: the cross-compiled `microteams` binaries and the
          # static tmux, laid out as connector/<target>/{microteams,tmux} (Go-style os-arch, matching
          # install.sh's `target` and update.go's platformDir). It's a shipped build artifact, so it
          # lives at the top level as connector/ — NOT under app_data/, which gen-env.sh creates fresh
          # at deploy time and holds only state you back up. compose bind-mounts connector/ to the
          # backend's default application.connector-binaries-dir (/app/connector).
          CONN="$STAGE/connector"
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${t%-*}"; arch="${t#*-}"
            mkdir -p "$CONN/$t"
            cp "artifacts/cli-binaries/microteams-$os-$arch" "$CONN/$t/microteams"
            chmod +x "$CONN/$t/microteams"
          done
          # Static tmux is Linux-only; macOS uses its own via install.sh's system-tmux fallback.
          # Each arch is its own artifact (tmux-linux-<arch>/tmux) from the matrix build.
          for t in linux-amd64 linux-arm64; do
            arch="${t#linux-}"
            if [ -f "artifacts/tmux-linux-$arch/tmux" ]; then
              cp "artifacts/tmux-linux-$arch/tmux" "$CONN/$t/tmux"
              chmod +x "$CONN/$t/tmux"
            fi
          done
          # Pin every image to a digest in the SHIPPED compose so a deployed bundle is reproducible,
          # while the repo keeps only readable tags (a committed hash goes stale whenever a tag is
          # re-pushed). buildx imagetools reads public manifests with no auth; the resolved digest is
          # the multi-arch index digest, which is what compose should pull.
          COMPOSE="$STAGE/docker-compose.yml"
          for ref in $(grep -oE '^[[:space:]]*image:[[:space:]]*[^[:space:]]+' "$COMPOSE" | awk '{print $NF}'); do
            case "$ref" in *@sha256:*) continue ;; esac   # already pinned — leave it
            # Retry: registry manifest reads blip intermittently and shouldn't fail a release.
            digest=""
            for attempt in 1 2 3 4 5; do
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              case "$digest" in sha256:*) break ;; esac
              echo "  ($ref) digest not resolved yet (attempt $attempt), retrying…" >&2
              sleep 3
            done
            case "$digest" in sha256:*) : ;; *) echo "could not resolve digest for $ref after retries" >&2; exit 1 ;; esac
            esc="$(printf '%s' "$ref" | sed 's/[.[\*^$/]/\\&/g')"   # escape regex metachars in the tag
            sed -i "s#image: ${esc}\$#image: ${ref}@${digest}#" "$COMPOSE"
            echo "pinned $ref -> ${ref}@${digest}"
          done
          echo "== pinned images =="; grep -nE '^[[:space:]]*image:' "$COMPOSE"
          # Three levels deep, which is where the interesting files are — but the web app's own
          # trees are deeper than that, and a listing that silently stops short reads as "these
          # files are missing". So the deep ones get a line saying how much is down there.
          echo "== bundle contents =="; find "$STAGE" -maxdepth 3 -type f | sort
          echo "== and below that =="
          for deep in frontend/dist/assets frontend/dist/canvaskit frontend/dist/downloads; do
            [ -d "$STAGE/$deep" ] || continue
            printf '%s: %s files, %s\n' "$deep" \
              "$(find "$STAGE/$deep" -type f | wc -l)" \
              "$(du -sh "$STAGE/$deep" | cut -f1)"
          done
          find "$STAGE/frontend/dist/downloads" -type f 2>/dev/null | sort
      # Upload the bundle DIRECTORY, not a pre-made zip: actions/upload-artifact already zips what it
      # receives, so uploading a .zip would nest it (download → microteams-deploy.zip → the real zip).
      # Uploading the dir means the downloaded artifact zip IS the bundle, one layer.
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: microteams-deploy
          path: microteams-deploy

  # The one test that exercises this system the way it is actually used: the shipped bundle, plus a
  # real machine with the real connector on it. `test-compose` used to stop at "the containers report
  # healthy", which cannot see the half of the product that lives on a machine — the connector, its
  # private tmux, the applet driving a terminal, and the path a chat message takes into a program.
  # Every incident so far has lived exactly there, so that is what this boots and asserts.
  #
  # The matrix is what plays the agent's program, and both entries are the real Claude Code.
  #
  # `npm:2.1.220` is PINNED, which is where the determinism comes from: nothing about it can change
  # without us changing the number, so a red run means we broke something. It used to share that job
  # with a `fake` stand-in — a shell script pretending to be Claude — and the stand-in is gone,
  # because pinning already buys what it was there for, while it cost a second implementation of
  # every leg and proved nothing about driving the real program.
  #
  # It is also the leg that proves the applet drives Claude Code at all: through the first-run
  # wizard, the bypass-permissions gate, and back out through `microteams api say`.
  #
  # The `installer` leg tracks Claude Code's latest and stays advisory (continue-on-error): a UI
  # change upstream is intelligence worth having, not a reason to block someone else's merge. When it
  # goes red, the fix belongs in the applet, and the pinned leg is what says whether we broke it.
  # The machinery, without anybody using it: the connector, its private tmux, the applet, and the
  # path a message takes into a program's stdin — driven by curl, with no client in the picture.
  # It is NOT the whole product end to end; test-journeys is, and this one is deliberately the layer
  # underneath, where a failure means the plumbing broke rather than the interface.
  test-machinery:
    name: machinery (connector, tmux, a message into stdin)
    needs: [package-zip]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: npm:2.1.220
            experimental: false
          - leg: installer
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      # The artifact is the bundle directory (not a zip); download-artifact restores its files
      # directly into microteams-deploy/ — no unzip step, and no nested archive. Note: artifact
      # up/download does NOT preserve the executable bit, so gen-env.sh is invoked via `bash` and the
      # connector binaries are chmod'ed on the machine after they are copied in.
      - uses: actions/download-artifact@v8
        with:
          name: microteams-deploy
          path: microteams-deploy
      - name: Bring the cluster up and wait for every service to be healthy
        working-directory: microteams-deploy
        run: |
          bash gen-env.sh
          docker compose up -d --wait --wait-timeout 360
      # Only the pinned leg exercises `microteams update`: it needs a distinctly-versioned connector
      # binary so the e2e can PROVE the running service re-execed into the freshly downloaded one
      # (not merely that a file on disk changed). It moved here when the `fake` leg was deleted —
      # this coverage was never about which program plays the agent, only about needing exactly one
      # leg to carry it. `setup-go` matches build-cli's toolchain, and the two env vars below persist
      # to the "End-to-end" step in the same job/leg.
      - uses: actions/setup-go@v7
        if: matrix.leg == 'npm:2.1.220'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build a marker-versioned connector (to prove `microteams update` swaps and re-execs)
        if: matrix.leg == 'npm:2.1.220'
        run: |
          MARKER="update-e2e-${GITHUB_SHA::12}"
          ( cd cli && go build -trimpath -ldflags "-X main.version=$MARKER" -o "$GITHUB_WORKSPACE/updated-microteams" . )
          echo "UPDATE_MARKER_BIN=$GITHUB_WORKSPACE/updated-microteams" >> "$GITHUB_ENV"
          echo "UPDATE_MARKER_VERSION=$MARKER" >> "$GITHUB_ENV"
      - name: "End-to-end: machine + agent + a message that must arrive (${{ matrix.leg }})"
        working-directory: microteams-deploy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/e2e.sh" "${{ matrix.leg }}"
      - name: Cluster status
        if: always()
        working-directory: microteams-deploy
        run: docker compose ps
      - name: Dump logs on failure
        if: failure()
        working-directory: microteams-deploy
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        working-directory: microteams-deploy
        run: docker compose down

  # How many journey runs, and which: a pairing of client sides against machine environments, so that
  # everything is covered in max(clients, environments) runs. The function lives in the repo
  # (app/tool/e2e/pairs.py) rather than in this file, because adding a client should be one line in a
  # list — not a matrix somebody has to recompute by hand and can quietly get wrong.
  plan-journeys:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pairs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pairs
        run: echo "matrix=$(python3 app/tool/e2e/pairs.py --json)" >> "$GITHUB_OUTPUT"
      - run: python3 app/tool/e2e/pairs.py

  # The journey: the same bundle, driven through the interface a person uses.
  #
  # This is the other half of test-machinery. That one proves the plumbing works by driving the API
  # with curl; this one proves a PERSON can reach it — every step goes through the real client, in a real
  # browser, against the deployment we ship. See todo/microteams/testing-e2e.md.
  #
  # One journey, not one per half: each run signs up, works in the app, brings a machine in and puts
  # an agent on it. Splitting the halves into separate jobs would cost clients + environments runs
  # where the pairing above costs max(clients, environments). When a run fails, which step broke is
  # answered by the trace the journey prints, not by the name of the job.
  test-journeys:
    needs: [package-zip, plan-journeys]
    runs-on: ubuntu-latest
    # A leg that hangs is a leg that never reports. Without this the first android run sat in
    # `adb wait-for-device` for an hour and three quarters and would have gone on to six, which is
    # the default — and a job nobody can wait for is one people learn to ignore.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-journeys.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-app
      # Deliberately NOT in the workspace. A running deployment writes app_data/ as the users inside
      # its containers, and anything that later walks the workspace — the pub cache's own post-job
      # step, for one — then trips over directories it may not read. Keeping the bundle in the
      # runner's temp keeps the checkout exactly as checked out.
      - uses: actions/download-artifact@v8
        with:
          name: microteams-deploy
          path: ${{ runner.temp }}/microteams-deploy
      # The runner image ships Chrome and a matching ChromeDriver; the fallback is for images that
      # do not, and for anybody running this workflow somewhere else.
      - name: Make sure there is a chromedriver
        if: matrix.client == 'web'
        run: |
          command -v chromedriver && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-driver

      # --- the android leg -------------------------------------------------------------------
      # Written out rather than taken from an action, because every line of it was established by
      # running it: this is the same sequence that took the journey from red to green on a real
      # machine, and an action would be a dependency between us and a thing we already know.
      #
      # The udev rule is not optional. /dev/kvm exists on this runner and is owned by root, so the
      # emulator falls back to software rendering and takes long enough that the journey's own
      # timeout kills it — reported as "the app never reached the test", which is a sentence about
      # nothing.
      - name: Let the emulator use KVM
        if: matrix.client == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Gradle is the whole cost of this leg from cold. The key is the lockfile and the wrapper,
      # so a run that changes neither downloads nothing.
      - uses: actions/cache@v4
        if: matrix.client == 'android'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-journey-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-journey-${{ runner.os }}-
      - name: An emulator, booted
        if: matrix.client == 'android'
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            platform-tools emulator "system-images;android-30;default;x86_64" \
            "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n mt-e2e -k "system-images;android-30;default;x86_64" -d pixel_5
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          nohup "$ANDROID_HOME/emulator/emulator" -avd mt-e2e -no-window -no-audio \
            -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data \
            > /tmp/emulator.log 2>&1 &
          # Bounded, all of it. `adb wait-for-device` blocks FOREVER when no device ever appears,
          # which is exactly what a broken boot looks like, and the job then hangs with nothing on
          # screen to say why. Every wait here has an end, and the end prints the emulator's own log.
          if ! timeout 300 "$ANDROID_HOME/platform-tools/adb" wait-for-device; then
            echo "no device appeared in five minutes — the emulator's own log:"
            tail -80 /tmp/emulator.log
            exit 1
          fi
          booted=
          for _ in $(seq 1 60); do
            [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed \
                 2>/dev/null | tr -d '\r')" = "1" ] && { booted=1; break; }
            sleep 5
          done
          if [ -z "$booted" ]; then
            echo "the device is there but never finished booting — the emulator's own log:"
            tail -80 /tmp/emulator.log
            exit 1
          fi
          "$ANDROID_HOME/platform-tools/adb" devices

      - name: "A person's journey, end to end (${{ matrix.client }} + ${{ matrix.leg }})"
        working-directory: app
        run: |
          bash tool/e2e/run.sh \
            --bundle "${{ runner.temp }}/microteams-deploy" \
            --client "${{ matrix.client }}" \
            --leg "${{ matrix.leg }}"
      - name: Dump logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/microteams-deploy
        run: docker compose logs --no-color --tail 200
      - name: What the emulator said, on failure
        if: failure() && matrix.client == 'android'
        run: tail -100 /tmp/emulator.log || true
      - name: Tear down
        if: always()
        working-directory: ${{ runner.temp }}/microteams-deploy
        run: docker compose down -v

  # One check to require in branch protection: it succeeds only when every job above did (a job with
  # `needs` runs only if all of them passed), so adding a job later never means editing the rule.
  # The three leaves, and nothing else: package-zip already needs every build, and both test jobs
  # already need package-zip, so naming those here would only repeat what the graph says. A job
  # whose dependency fails is skipped rather than failed, and a skipped need is not a success — so
  # this still cannot go green over a broken build.
  #
  # The one thing to remember when adding a job: if nothing else depends on it, it belongs here, or
  # it is a check that can go red without anybody being stopped.
  ci-success:
    name: CI success
    needs: [test-api, test-machinery, test-journeys]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI jobs passed."
