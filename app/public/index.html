<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- resizes-content: a phone browser shrinks the page when its keyboard opens, so the composer
         sits on the keyboard instead of under it. viewport-fit=cover: the app draws to the edges
         and keeps clear of them itself (safe-area insets). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Chat with your team and the agents running on your machines." />
    <!-- The app's colour from the first byte, so there is no white flash before the first frame. -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MicroTeams" />
    <!-- Absolute, because this document is served for every route under /app/ (app.json's
         experiments.baseUrl); a relative path would resolve against /app/chats/ and miss. -->
    <link rel="apple-touch-icon" href="/app/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="manifest" href="/app/manifest.json" />
    <title>MicroTeams</title>
    <!-- The fonts — the monospace face in both weights, and Noto Sans SC for Chinese — are registered
         by the loader (worker/loader.js) from its cache, not by @font-face rules here. -->
    <!-- The splash, from the first byte until the app has drawn a complete first screen (it sets
         data-mt-ready on <html>; src/platform/ready.web.ts), so nothing assembles in front of the
         reader. After twenty seconds it says it is taking too long and offers the two things that
         help: trying again, and clearing the app's cache. -->
    <style>
      #mt-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: #060606; color: #f5f5f5; z-index: 2147483647; font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity .2s ease; }
      #mt-splash-word { color: #8a8a8a; }
      #mt-splash-slow { color: #8a8a8a; font-size: 13px; text-align: center; line-height: 1.8; }
      #mt-splash-slow a { color: #f5f5f5; }
      html[data-mt-ready="1"] #mt-splash { opacity: 0; pointer-events: none; }
    </style>
    <style id="expo-reset">
      html, body { margin: 0; padding: 0; height: 100%; background: #000; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      /* The browser's own focus ring drew a white edge round every field; the app's fields show
         focus with their green border instead. */
      input:focus, textarea:focus { outline: none; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="mt-splash">
      <div>MicroTeams</div>
      <div id="mt-splash-word">loading…</div>
      <div id="mt-splash-slow" hidden>
        <div>This is taking longer than it should.</div>
        <div><a href="" onclick="location.reload();return false">try again</a> &nbsp;·&nbsp; <a href="/app/unregister.html">clear this app's cache</a></div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        if (document.documentElement.dataset.mtReady !== "1") document.getElementById("mt-splash-slow").hidden = false;
      }, 20000);
    </script>
  </body>
</html>
