<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Chat with your team and the agents running on your machines.">

  <!-- Matches background_color in the manifest, so the gap between the document arriving and the
       first frame is the app's colour rather than a white flash. -->
  <meta name="theme-color" content="#060606">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MicroTeams">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">

  <title>MicroTeams</title>

  <style>
    /* The document is dark from the first byte. Everything else is drawn by the app. */
    html, body { margin: 0; padding: 0; height: 100%; background: #060606; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Our service worker, not Flutter's — see web/sw.js for why theirs is a dead end.

    Registered after load so it never competes with the engine for the first paint: everything it
    does is for the SECOND visit, and racing it against the first one only makes that slower.
  -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((e) => {
          // Not fatal, and not silent: the app works without it, just not offline.
          console.warn("service worker registration failed", e);
        });
      });
    }
  </script>
</body>
</html>
